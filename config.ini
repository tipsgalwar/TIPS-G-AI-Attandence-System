[server]
host = 93.127.166.30
port = 8004

[app]
icon = TIPS-G-ALWAR.ico
timeout = 30

[ai]
# Face Recognition & Distance Metric Settings
face_detector_backend = retinaface
face_recognition_model = ArcFace
face_distance_metric = cosine
similarity_threshold = 0.50
minimum_confidence = 58.0
duplicate_threshold = 0.49

# Liveness Detection Settings (Local Camera Checks)
liveness_enabled = true
liveness_3d_enabled = true
min_3d_depth_disparity = 0.015
min_depth_std_dev = 0.008
blink_detection_enabled = true
ear_threshold = 0.19
head_movement_enabled = true
yaw_threshold = 15.0
pitch_threshold = 10.0

# Adaptive Template & Multi-Frame Verification
adaptive_update_enabled = true
adaptive_confidence_threshold = 80.0
adaptive_learning_rate = 0.12
burst_frames_count = 3

