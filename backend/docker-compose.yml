services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tipsg_attendance_backend
    restart: always
    env_file:
      - .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - TZ=Asia/Kolkata
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
