name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'dist/**'
      - 'dist_installer/**'

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting Automated TIPS-G CI/CD Deployment..."
            
            TARGET_DIR="$HOME/apps/TIPS-G-AI-Attandence-System"
            mkdir -p "$HOME/apps"
            
            # 1. Fresh clone or pull
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "📦 Cloning repository on VPS..."
              rm -rf "$TARGET_DIR"
              git clone https://github.com/tipsgalwar/TIPS-G-AI-Attandence-System.git "$TARGET_DIR"
              cd "$TARGET_DIR"
            else
              echo "🔄 Pulling latest updates from GitHub..."
              cd "$TARGET_DIR"
              git reset --hard HEAD
              git pull origin main
            fi
            
            # 2. Enable sparse checkout to only keep backend directories on VPS
            git sparse-checkout init --cone
            git sparse-checkout set src backend config .github
            
            # 3. Ensure backend .env exists
            if [ ! -f "backend/.env" ] && [ -f ".env" ]; then
              cp .env backend/.env
            fi
            
            # 4. Rebuild and launch backend container on Port 8000
            echo "🐳 Building and starting Docker container on Port 8000..."
            if [ -f "backend/docker-compose.yml" ]; then
              docker compose -f backend/docker-compose.yml down || true
              docker compose -f backend/docker-compose.yml up -d --build
            elif [ -f "docker-compose.yml" ]; then
              docker compose down || true
              docker compose up -d --build
            fi
            
            # 5. Health Check on Port 8000
            sleep 4
            curl -f http://localhost:8000/ || echo "Backend service running on port 8000."
            
            echo "🎉 Deployment successfully completed!"
