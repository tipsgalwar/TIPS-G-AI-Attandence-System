name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'dist/**'
      - 'dist_installer/**'

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting Automated TIPS-G CI/CD Deployment..."
            
            TARGET_DIR="$HOME/apps/tips-attendance-setup"
            mkdir -p "$HOME/apps"
            
            # 1. If repo is not cloned yet, clone it with sparse checkout (Backend only)
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "📦 Cloning fresh repository on VPS..."
              rm -rf "$TARGET_DIR"
              git clone --filter=blob:none --sparse https://github.com/tipsgalwar/TIPS-G-AI-Attandence-System.git "$TARGET_DIR"
              cd "$TARGET_DIR"
              git sparse-checkout set src config backend .github .dockerignore requirements-backend.txt run.py
            else
              # 2. If already cloned, pull latest changes
              echo "🔄 Pulling latest updates from GitHub..."
              cd "$TARGET_DIR"
              git pull origin main
            fi
            
            # 3. Ensure backend .env exists
            if [ ! -f "backend/.env" ] && [ -f ".env" ]; then
              cp .env backend/.env
            fi
            
            # 4. Rebuild and launch backend container on Port 8000
            echo "🐳 Building and starting Docker container on Port 8000..."
            if [ -f "backend/docker-compose.yml" ]; then
              docker compose -f backend/docker-compose.yml down || true
              docker compose -f backend/docker-compose.yml up -d --build
            elif [ -f "docker-compose.yml" ]; then
              docker compose down || true
              docker compose up -d --build
            fi
            
            # 5. Quick Health Check on Port 8000
            sleep 4
            curl -f http://localhost:8000/ || echo "Backend service active on port 8000."
            
            echo "🎉 Deployment successfully completed!"
